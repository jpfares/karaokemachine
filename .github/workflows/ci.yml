name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install ALSA headers for cpal
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml

  tools:
    name: Import tools and map index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Bundle
        run: npm run assets
      - name: Map index and covers are committed up to date
        run: |
          node scripts/build-map-index.mjs
          git status --porcelain -- site/maps
          test -z "$(git status --porcelain -- site/maps)"
